name: GujType
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: 13.0
targets:
  GujType:
    type: application
    platform: macOS
    sources:
      - path: Sources/GujType
        excludes:
          - Info.plist
          - Resources
      - path: Sources/GujType/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vaani.app
        PRODUCT_NAME: Vaani
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/GujType/Info.plist
        SWIFT_VERSION: 5.0
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: NO
